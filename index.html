<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#635bdb">
<title>小宇小妤智慧學習測驗</title>
<style>
:root{--ink:#24243a;--muted:#72738a;--brand:#635bdb;--brand2:#8b83f4;--bg:#f5f6fc;--card:#fff;--line:#e8e9f2;--good:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{background:linear-gradient(120deg,#5149c9,#8d83f5);color:white;padding:26px 18px 34px}
.wrap{max-width:900px;margin:auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.tag{font-size:12px;background:#ffffff25;padding:6px 10px;border-radius:20px}
h1{font-size:clamp(25px,5vw,38px);margin:25px 0 7px}.sub{opacity:.9;margin:0}
main{margin:-18px auto 40px;position:relative}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 25px #29265b0a}
h2{font-size:19px;margin:0 0 14px}.muted{color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 7px}input,select{width:100%;padding:13px 14px;border:1px solid #dcddea;border-radius:12px;font:inherit;background:white;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:700}
.primary{background:var(--brand);color:white}.secondary{background:#efefff;color:var(--brand)}.choice{background:white;border:1px solid var(--line);text-align:left;color:var(--ink);min-height:72px}.choice:hover,.choice.selected{border:2px solid var(--brand);background:#f5f4ff}.choice strong{display:block;font-size:16px}.choice small{display:block;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}
.progress{height:8px;background:#eeeef6;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:var(--brand);width:0}
.option{display:block;width:100%;text-align:left;background:#fafaff;border:1px solid var(--line);margin:9px 0;color:var(--ink)}.option.correct{border-color:#2b9b69;background:#edfaf3}.option.wrong{border-color:#d85b67;background:#fff1f2}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat div{background:#f7f7ff;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:23px;display:block;color:var(--brand)}
.record{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.panel{padding:18px}.stat{gap:6px}.stat div{padding:10px 5px}.stat b{font-size:19px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><div class="brand">📚 小宇小妤智慧學習測驗</div><span class="tag">學習・練習・成長</span></div><h1>今天想挑戰什麼？</h1><p class="sub">依年級與科目選擇練習，完成測驗後查看成績。</p></div></header>
<main class="wrap">
<section class="panel" id="welcome">
<h2>👋 歡迎來到智慧學習測驗</h2>
<p class="muted">可以直接開始測驗，也可以輸入暱稱保存本機學習紀錄。</p>
<label for="nickname">暱稱（選填）</label><input id="nickname" maxlength="20" placeholder="例如：小宇、小妤">
<div class="actions"><button class="primary" id="saveName">使用暱稱並保存紀錄</button><button class="secondary" id="guest">直接開始（免登入）</button></div>
<p class="muted" id="welcomeMsg"></p>
</section>
<section class="panel" id="setup">
<h2>🎯 選擇學習範圍</h2>
<label for="level">學習階段</label><select id="level"><option value="國小">國小</option><option value="高中">高中</option></select>
<label for="grade">年級</label><select id="grade"></select>
<label>選擇科目</label><div class="grid" id="subjects"></div>
<div class="actions"><button class="primary" id="start" disabled>開始測驗 →</button></div>
</section>
<section class="panel hidden" id="quiz">
<div class="top"><span class="muted" id="quizMeta"></span><strong id="counter"></strong></div><div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2><div id="options"></div><p class="muted" id="feedback"></p>
<div class="actions"><button class="primary" id="next" disabled>下一題</button><button class="secondary" id="quit">結束測驗</button></div>
</section>
<section class="panel hidden" id="result">
<h2>🎉 測驗完成！</h2><div class="stat"><div><b id="score">0</b><span class="muted">答對題數</span></div><div><b id="percent">0%</b><span class="muted">正確率</span></div><div><b id="total">0</b><span class="muted">總題數</span></div></div>
<p id="resultText"></p><div class="actions"><button class="primary" id="again">再測一次</button><button class="secondary" id="back">回選擇科目</button></div>
</section>
<section class="panel" id="records"><h2>📈 學習紀錄</h2><p class="muted" id="recordHint">登入暱稱後，測驗紀錄會保存在這台裝置的瀏覽器。</p><div id="recordList"></div></section>
</main><footer>小宇小妤智慧學習測驗 · 第一階段體驗版</footer>
<script>
const bank={
'國小':{
'國語':[{q:'「守株待兔」主要是在提醒我們什麼？',o:['要努力工作','不能只靠運氣、不知變通','兔子跑得很快','要多種樹'],a:1,e:'守株待兔比喻不主動努力，只想靠僥倖獲得成功。'},{q:'下列哪個詞語的意思最接近「勤奮」？',o:['懶惰','努力','猶豫','慌張'],a:1,e:'勤奮就是認真努力、不懈怠。'}],
'數學':[{q:'一盒彩色筆有 12 枝，買了 3 盒，共有幾枝？',o:['15枝','24枝','36枝','48枝'],a:2,e:'12 × 3 = 36。'},{q:'一個長方形長 8 公分、寬 5 公分，面積是多少？',o:['13平方公分','26平方公分','40平方公分','80平方公分'],a:2,e:'長方形面積＝長 × 寬＝8 × 5＝40。'}],
'自然':[{q:'植物通常利用哪個部位吸收土壤中的水分？',o:['花','葉','根','果實'],a:2,e:'根能吸收水分與礦物質。'},{q:'水結冰時，狀態會如何改變？',o:['固態變液態','液態變固態','氣態變液態','固態變氣態'],a:1,e:'水結冰是液態變成固態。'}],
'英文':[{q:'“apple” 的中文是什麼？',o:['香蕉','蘋果','橘子','葡萄'],a:1,e:'apple 是蘋果。'},{q:'“Good morning” 通常是什麼意思？',o:['晚安','再見','早安','謝謝'],a:2,e:'Good morning 是早安。'}]
},
'高中':{
'國文':[{q:'「先天下之憂而憂，後天下之樂而樂」出自哪位作者？',o:['陶淵明','范仲淹','蘇軾','韓愈'],a:1,e:'此句出自范仲淹〈岳陽樓記〉。'},{q:'「不以物喜，不以己悲」主要強調什麼態度？',o:['隨外物起伏','保持豁達平穩','追求名利','逃避責任'],a:1,e:'強調不因外在得失而過度悲喜。'}],
'數學':[{q:'若 log₁₀100 = x，則 x 等於多少？',o:['1','2','10','100'],a:1,e:'因為 10²＝100，所以 log₁₀100＝2。'},{q:'向量 (3,4) 的長度是多少？',o:['4','5','7','12'],a:1,e:'長度＝√(3²＋4²)＝√25＝5。'}],
'英文':[{q:'Choose the correct sentence.',o:['She go to school.','She goes to school.','She going school.','She gone to school.'],a:1,e:'第三人稱單數現在式，動詞 go 要加 es。'},{q:'“Although it was raining, we went out.” 的 although 表示？',o:['因為','所以','雖然','除非'],a:2,e:'Although 表示「雖然」，引導讓步子句。'}],
'地理':[{q:'外國企業到另一個國家設廠，最直接屬於哪種現象？',o:['外國直接投資','人口自然增加','季風環流','地形侵蝕'],a:0,e:'企業在國外設立或取得生產據點，屬於外國直接投資。'},{q:'大量生產使平均成本下降，稱為什麼？',o:['聚集經濟','規模經濟','機會成本','外部成本'],a:1,e:'規模經濟是產量增加時，平均生產成本下降。'}],
'歷史':[{q:'工業革命最早起源於哪個國家？',o:['法國','英國','德國','美國'],a:1,e:'第一次工業革命最早於 18 世紀後期在英國展開。'},{q:'秦始皇統一六國後，推行哪一項措施以統一文字？',o:['書同文','郡國並行','科舉制度','均田制'],a:0,e:'秦朝推行書同文，統一文字書寫。'}]
}};
const $=id=>document.getElementById(id);let nickname='',subject='',questions=[],index=0,correct=0,answered=false;
function show(id){['welcome','setup','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function setGrades(){const level=$('level').value;const vals=level==='國小'?['一年級','二年級','三年級','四年級','五年級','六年級']:['高一','高二','高三'];$('grade').innerHTML=vals.map(x=>'<option>'+x+'</option>').join('');renderSubjects()}
function renderSubjects(){const level=$('level').value;const names=Object.keys(bank[level]);$('subjects').innerHTML=names.map(s=>'<button class="choice" data-sub="'+s+'"><strong>'+s+'</strong><small>練習題目</small></button>').join('');$('start').disabled=true;subject='';document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subject=b.dataset.sub;document.querySelectorAll('[data-sub]').forEach(x=>x.classList.toggle('selected',x===b));$('start').disabled=false})}
function records(){const all=JSON.parse(localStorage.getItem('xy_records')||'[]');$('recordList').innerHTML=all.length?all.slice(0,8).map(r=>'<div class="record"><span>'+r.name+' · '+r.grade+' '+r.subject+'</span><strong>'+r.score+'/'+r.total+'（'+r.percent+'%）</strong></div>').join(''):'<p class="muted">目前還沒有測驗紀錄。</p>'}
function startQuiz(){questions=bank[$('level').value][subject].slice();index=0;correct=0;answered=false;$('quizMeta').textContent=$('level').value+' · '+$('grade').value+' · '+subject;show('quiz');renderQuestion()}
function renderQuestion(){const q=questions[index];$('counter').textContent=(index+1)+' / '+questions.length;$('bar').style.width=(index/questions.length*100)+'%';$('question').textContent=q.q;$('options').innerHTML=q.o.map((v,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+v+'</button>').join('');$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'查看結果':'下一題';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}
function answer(n){if(answered)return;answered=true;const q=questions[index];if(n===q.a)correct++;document.querySelectorAll('[data-i]').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});$('feedback').textContent=(n===q.a?'答對了！':'再接再厲！')+' '+q.e;$('next').disabled=false}
function finish(){const total=questions.length,pct=Math.round(correct/total*100);$('score').textContent=correct;$('percent').textContent=pct+'%';$('total').textContent=total;$('resultText').textContent=(nickname?nickname+'，':'')+(pct>=80?'表現很棒，繼續保持！':pct>=60?'做得不錯，再複習一次會更好！':'別氣餒，看看解析再挑戰一次！');if(nickname){const all=JSON.parse(localStorage.getItem('xy_records')||'[]');all.unshift({name:nickname,grade:$('grade').value,subject,score:correct,total,percent:pct,date:new Date().toLocaleDateString()});localStorage.setItem('xy_records',JSON.stringify(all.slice(0,30)))}records();show('result')}
$('saveName').onclick=()=>{nickname=$('nickname').value.trim();if(!nickname){$('welcomeMsg').textContent='請先輸入暱稱，或選擇免登入測驗。';return}$('welcomeMsg').textContent='你好，'+nickname+'！紀錄將保存在這台裝置。';show('setup')};
$('guest').onclick=()=>{nickname='';show('setup')};$('level').onchange=setGrades;$('start').onclick=startQuiz;$('next').onclick=()=>{if(index<questions.length-1){index++;answered=false;renderQuestion()}else finish()};$('quit').onclick=()=>show('setup');$('again').onclick=startQuiz;$('back').onclick=()=>show('setup');setGrades();records();show('welcome');
</script>
</body></html>
